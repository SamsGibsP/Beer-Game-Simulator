<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Dashboard - Blitz Beer Game (DRP)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans p-4 sm:p-8 flex items-center justify-center">

  <div class="max-w-2xl w-full">
    
    <!-- Header -->
    <div class="bg-white rounded-t-2xl shadow p-6 border-b-4 border-blue-600 text-center flex justify-between items-center">
      <div class="text-left">
        <h1 class="text-2xl font-black text-gray-800" id="roleDisplay">Loading Role...</h1>
        <p class="text-gray-500 font-medium">Room: <span id="roomDisplay" class="text-blue-600 font-bold tracking-widest">---</span></p>
      </div>
      <div class="text-right">
        <div class="text-sm text-gray-500 font-bold uppercase tracking-wider">Minggu Ke</div>
        <div class="text-4xl font-black text-blue-600" id="roundDisplay">-</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="bg-white rounded-b-2xl shadow p-6 sm:p-8 min-h-[400px] flex flex-col justify-center">
      
      <!-- Waiting Screen -->
      <div id="waitingScreen">
        <div class="animate-pulse flex flex-col items-center py-10">
          <div class="rounded-full bg-blue-100 h-24 w-24 flex items-center justify-center mb-6">
            <svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <h2 class="text-2xl font-bold text-gray-700 mb-2" id="waitingTitle">Menunggu...</h2>
          <p class="text-gray-500 text-center" id="waitingSubtitle">Game belum dimulai oleh Host.</p>
        </div>
      </div>

      <!-- Action Screen -->
      <div id="actionScreen" class="hidden">
        
        <!-- Status Cards -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
          
          <div class="bg-blue-50 rounded-xl p-4 text-center border border-blue-100">
            <p class="text-xs text-blue-600 font-bold uppercase mb-1">Inventori</p>
            <p class="text-3xl font-black text-blue-800" id="valInv">0</p>
          </div>
          
          <div class="bg-red-50 rounded-xl p-4 text-center border border-red-100">
            <p class="text-xs text-red-600 font-bold uppercase mb-1">Backlog</p>
            <p class="text-3xl font-black text-red-800" id="valBacklog">0</p>
          </div>
          
          <div class="bg-amber-50 rounded-xl p-4 text-center border border-amber-100">
            <p class="text-xs text-amber-600 font-bold uppercase mb-1">Tiba Mg Depan (SD2)</p>
            <p class="text-3xl font-black text-amber-800" id="valSD2">0</p>
          </div>
          
          <div class="bg-gray-50 rounded-xl p-4 text-center border border-gray-200">
            <p class="text-xs text-gray-600 font-bold uppercase mb-1">Tiba 2 Mg Lagi (SD1)</p>
            <p class="text-3xl font-black text-gray-800" id="valSD1">0</p>
          </div>

        </div>

        <!-- Incoming Order -->
        <div class="bg-indigo-50 border-2 border-indigo-200 rounded-xl p-6 mb-8 text-center shadow-inner">
          <p class="text-indigo-800 font-bold mb-1 uppercase tracking-wider text-sm">Pesanan Masuk Minggu Ini</p>
          <div class="text-6xl font-black text-indigo-600 my-2" id="valIncoming">0</div>
          <p class="text-indigo-500 text-sm">Harus dipenuhi dari inventori Anda.</p>
        </div>

        <!-- Order Form -->
        <div class="bg-white border-2 border-gray-200 rounded-xl p-6 shadow-sm">
          <label class="block text-gray-800 font-bold mb-2 text-xl text-center">Pesanan Baru (Order Placed):</label>
          <p class="text-sm text-gray-500 mb-6 text-center">Masukkan jumlah pesanan/produksi untuk minggu ini.</p>
          <div class="flex items-center justify-center gap-4">
            <input type="number" id="orderInput" class="w-1/2 border-2 border-blue-300 p-4 rounded-xl text-4xl font-black text-center focus:outline-none focus:border-blue-600 bg-blue-50" placeholder="0" min="0">
            <button onclick="submitOrder()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-black py-4 px-4 rounded-xl transition duration-200 text-xl shadow-lg transform hover:scale-105">
              KIRIM
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const socket = io();
    
    // Parse URL params
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room');
    const role = urlParams.get('role');
    const playerName = urlParams.get('name') || role;

    if (!roomCode || !role) {
      alert('Invalid room or role.');
      window.location.href = 'index.html';
    }

    document.getElementById('roleDisplay').innerText = role;
    document.getElementById('roomDisplay').innerText = roomCode;

    socket.emit('joinRoom', { roomCode, role, playerName });

    socket.on('error', (msg) => {
      alert(msg);
      window.location.href = 'index.html';
    });

    socket.on('gameStarted', ({ round, state }) => {
      startRound(round, state);
    });

    socket.on('newRound', ({ round, state }) => {
      startRound(round, state);
    });

    function startRound(round, fullState) {
      document.getElementById('roundDisplay').innerText = round;
      
      const myState = fullState[role];
      
      document.getElementById('valInv').innerText = myState.inventory;
      document.getElementById('valBacklog').innerText = myState.backlog;
      document.getElementById('valSD2').innerText = myState.pipeline2;
      document.getElementById('valSD1').innerText = myState.pipeline1;
      document.getElementById('valIncoming').innerText = myState.incomingOrder;

      document.getElementById('waitingScreen').classList.add('hidden');
      document.getElementById('actionScreen').classList.remove('hidden');
      
      const input = document.getElementById('orderInput');
      input.value = '';
      setTimeout(() => input.focus(), 100);
    }

    function setWaiting(title, subtitle) {
      document.getElementById('actionScreen').classList.add('hidden');
      document.getElementById('waitingScreen').classList.remove('hidden');
      document.getElementById('waitingTitle').innerText = title;
      document.getElementById('waitingSubtitle').innerText = subtitle;
    }

    function submitOrder() {
      const val = parseInt(document.getElementById('orderInput').value);
      if (isNaN(val) || val < 0) {
        alert('Masukkan jumlah pesanan valid (minimal 0)!');
        return;
      }
      
      socket.emit('submitOrder', { roomCode, role, orderAmount: val });
      setWaiting('Pesanan Terkirim!', 'Menunggu pemain lain memproses pesanan mereka...');
    }

    socket.on('gameFinished', ({ history }) => {
      sessionStorage.setItem('gameHistory', JSON.stringify(history));
      window.location.href = 'result.html';
    });
  </script>
</body>
</html>
